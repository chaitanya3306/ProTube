name: Extension validation

on:
  push:
    branches: [main, "release/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate manifest and runtime assets
        run: python scripts/validate_extension.py
      - name: Check JavaScript syntax
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find js -type f -name '*.js' -print0)
      - name: Run clickbait and scoring tests
        run: node tests/clickbait.test.js
      - name: Build store upload packages
        run: |
          python scripts/package_extension.py
          python scripts/package_firefox.py
      - name: Upload installable package
        uses: actions/upload-artifact@v4
        with:
          name: protube-store-package
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 14
