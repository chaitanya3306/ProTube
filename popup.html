<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>YT Focus Feed</title>
    <link rel="stylesheet" href="css/popup.css" />
  </head>
  <body>
    <header class="head">
      <div>
        <h1>YT Focus Feed</h1>
        <p id="status" class="sub">Checking settings…</p>
      </div>
      <span id="modeBadge" class="badge">Feed</span>
    </header>

    <div class="stats" id="statsRow">
      <span id="watchToday">Today: 0m</span>
      <span id="savedCount">Saved: 0</span>
    </div>

    <div class="toggles">
      <label class="toggle"><span>Zen Mode (Search Only)</span><input id="toggleZen" type="checkbox" /></label>
      <label class="toggle"><span>Hide Watch Sidebar</span><input id="toggleSidebar" type="checkbox" /></label>
      <label class="toggle"><span>Collapse Comments</span><input id="toggleComments" type="checkbox" /></label>
      <label class="toggle"><span>Hide Shorts</span><input id="toggleShorts" type="checkbox" /></label>
    </div>

    <div class="actions">
      <button id="focusTimer" type="button" class="secondary">Start 25m Focus Session</button>
      <button id="openHome" type="button">Open YouTube Home</button>
      <button id="refresh" type="button" class="ghost">Refresh feed</button>
      <button id="settings" type="button" class="ghost">Settings &amp; Presets</button>
    </div>

    <script src="js/constants.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/popup.js"></script>
  </body>
</html>
